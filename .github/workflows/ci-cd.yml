name: BillSync CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Lint
        run: flake8 --max-line-length=100 --exclude=venv .

      - name: Test
        run: pytest -v

  build:
    name: Docker Build and Smoke Test
    needs: test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build --build-arg GIT_SHA=${{ github.sha }} -t billsync .

      - name: Start container
        run: docker run -d --name billsync -p 5000:5000 billsync

      - name: Health smoke test
        run: |
          sleep 5
          curl -f http://localhost:5000/health

  deploy:
    name: Deploy to Render
    needs: build
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&ref=${{ github.sha }}"
